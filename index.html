// ==================== SHIP SCHEDULE ====================
function ShipSchedule({ schedules, setSchedules }) {
  const STATUS = [
    { id: 'booking', label: '予約中',  cls: 'bg-yellow-100 text-yellow-700' },
    { id: 'loaded',  label: '積込済',  cls: 'bg-blue-100 text-blue-700' },
    { id: 'transit', label: '航行中',  cls: 'bg-indigo-100 text-indigo-700' },
    { id: 'arrived', label: '入港済',  cls: 'bg-green-100 text-green-700' },
  ];
  const stCls = (id) => STATUS.find(s => s.id === id)?.cls || 'bg-gray-100 text-gray-600';
  const stLbl = (id) => STATUS.find(s => s.id === id)?.label || id;

  const empty = { vesselName: '', bookingNo: '', invoiceNo: '', portLoading: 'Tokyo, Japan', portDischarge: 'Los Angeles, CA, USA', departureDate: '', arrivalDate: '', status: 'booking', notes: '' };
  const [editing, setEditing] = useState(null);
  const [form, setForm]       = useState(empty);
  const [viewMode, setViewMode] = useState('kanban');

  const openNew  = () => { setEditing('new'); setForm(empty); };
  const openEdit = (s) => { setEditing(s.id); setForm({ ...s }); };
  const del      = (id) => { if (confirm('削除しますか？')) setSchedules(schedules.filter(s => s.id !== id)); };
  const save = () => {
    if (!form.departureDate) return alert('出港予定日は必須です');
    if (editing === 'new') setSchedules([...schedules, { ...form, id: Date.now().toString() }]);
    else setSchedules(schedules.map(s => s.id === editing ? { ...form, id: editing } : s));
    setEditing(null);
  };
  const nextStatus = (id) => {
    const order = ['booking', 'loaded', 'transit', 'arrived'];
    setSchedules(schedules.map(s => {
      if (s.id !== id) return s;
      const i = order.indexOf(s.status);
      return { ...s, status: order[Math.min(i + 1, order.length - 1)] };
    }));
  };

  const today  = new Date().toISOString().split('T')[0];
  const isLate = (s) => s.status !== 'arrived' && s.arrivalDate && s.arrivalDate < today;
  const sorted = [...schedules].sort((a, b) => (a.departureDate || '').localeCompare(b.departureDate || ''));
  const active = sorted.filter(s => s.status !== 'arrived');
  const done   = sorted.filter(s => s.status === 'arrived');

  const Group = ({ title, items }) => items.length === 0 ? null : (
    <div className="mb-4">
      <p className="text-xs font-semibold text-gray-400 uppercase mb-2">{title}</p>
      <div className="space-y-2">
        {items.map(s => (
          <div key={s.id} className={`bg-white rounded-xl p-4 shadow-sm ${isLate(s) ? 'border-l-4 border-red-400' : ''}`}>
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <span className="font-semibold">🚢 {s.vesselName || '（船名未設定）'}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${stCls(s.status)}`}>{stLbl(s.status)}</span>
                  {isLate(s) && <span className="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">入港遅延</span>}
                </div>
                <div className="flex gap-4 text-xs text-gray-500 flex-wrap">
                  <span>📍 {s.portLoading} → {s.portDischarge}</span>
                  {s.departureDate && <span>🛫 出港: {s.departureDate}</span>}
                  {s.arrivalDate   && <span>🛬 入港予定: {s.arrivalDate}</span>}
                  {s.bookingNo     && <span>📋 {s.bookingNo}</span>}
                  {s.invoiceNo     && <span>📄 {s.invoiceNo}</span>}
                </div>
                {s.notes && <p className="text-xs text-gray-400 mt-1">{s.notes}</p>}
              </div>
              <div className="flex gap-2 flex-shrink-0 items-center">
                {s.status !== 'arrived' && (
                  <button onClick={() => nextStatus(s.id)} className="text-xs bg-gray-100 text-gray-600 hover:bg-gray-200 px-2 py-1 rounded">次へ →</button>
                )}
                <button onClick={() => openEdit(s)} className="text-blue-600 hover:text-blue-800 text-sm">編集</button>
                <button onClick={() => del(s.id)} className="text-red-500 hover:text-red-700 text-sm">削除</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h2 className="text-xl font-bold text-gray-800">船積みスケジュール</h2>
        <div className="flex gap-2">
          <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
            <button onClick={() => setViewMode('kanban')} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${viewMode === 'kanban' ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>カンバン</button>
            <button onClick={() => setViewMode('list')}   className={`px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${viewMode === 'list'   ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>リスト</button>
          </div>
          <button onClick={openNew} className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm">+ 追加</button>
        </div>
      </div>

      {editing && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
          <div className="bg-white rounded-xl p-6 w-full max-w-lg shadow-2xl">
            <h3 className="font-bold text-lg mb-4">{editing === 'new' ? 'スケジュール追加' : 'スケジュール編集'}</h3>
            <div className="grid grid-cols-2 gap-3 mb-3">
              {[['船名', 'vesselName'], ['予約番号', 'bookingNo'], ['インボイス番号', 'invoiceNo']].map(([lbl, k]) => (
                <div key={k}><label className="text-sm text-gray-600">{lbl}</label><input className="w-full border rounded p-2 mt-1" value={form[k] || ''} onChange={e => setForm({ ...form, [k]: e.target.value })} /></div>
              ))}
              <div>
                <label className="text-sm text-gray-600">ステータス</label>
                <select className="w-full border rounded p-2 mt-1" value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
                  {STATUS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
              {[['出港地', 'portLoading'], ['入港地', 'portDischarge']].map(([lbl, k]) => (
                <div key={k}><label className="text-sm text-gray-600">{lbl}</label><input className="w-full border rounded p-2 mt-1" value={form[k] || ''} onChange={e => setForm({ ...form, [k]: e.target.value })} /></div>
              ))}
              {[['出港予定日 *', 'departureDate'], ['入港予定日', 'arrivalDate']].map(([lbl, k]) => (
                <div key={k}><label className="text-sm text-gray-600">{lbl}</label><input type="date" className="w-full border rounded p-2 mt-1" value={form[k] || ''} onChange={e => setForm({ ...form, [k]: e.target.value })} /></div>
              ))}
              <div className="col-span-2"><label className="text-sm text-gray-600">備考</label><input className="w-full border rounded p-2 mt-1" value={form.notes || ''} onChange={e => setForm({ ...form, notes: e.target.value })} /></div>
            </div>
            <div className="flex gap-2">
              <button onClick={save} className="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">保存</button>
              <button onClick={() => setEditing(null)} className="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200">キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {schedules.length === 0
        ? <EmptyState icon="🚢" msg="スケジュールがありません" sub="「+ 追加」から船積み予定を登録してください" />
        : viewMode === 'list'
          ? <><Group title="進行中" items={active} /><Group title="入港済" items={done} /></>
          : (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {STATUS.map(st => {
                const cols = schedules.filter(s => s.status === st.id);
                return (
                  <div key={st.id} className="bg-gray-50 rounded-xl p-3 min-h-48">
                    <div className="flex items-center justify-between mb-3">
                      <span className={`text-xs font-semibold px-2 py-1 rounded-full ${st.cls}`}>{st.label}</span>
                      <span className="text-xs text-gray-400">{cols.length}件</span>
                    </div>
                    <div className="space-y-2">
                      {cols.map(s => (
                        <div key={s.id} className={`bg-white rounded-lg p-2.5 shadow-sm text-xs ${isLate(s) ? 'border-l-2 border-red-400' : ''}`}>
                          <p className="font-semibold text-gray-800 mb-1 truncate">{s.vesselName || '（未設定）'}</p>
                          {s.invoiceNo    && <p className="text-gray-500 truncate">📄 {s.invoiceNo}</p>}
                          {s.departureDate && <p className="text-gray-500">🛫 {s.departureDate}</p>}
                          {s.arrivalDate  && <p className={isLate(s) ? 'text-red-500 font-medium' : 'text-gray-500'}>🛬 {s.arrivalDate}{isLate(s) ? ' 遅延' : ''}</p>}
                          <div className="flex gap-1 mt-2">
                            {s.status !== 'arrived' && <button onClick={() => nextStatus(s.id)} className="flex-1 text-xs bg-gray-100 hover:bg-gray-200 rounded py-0.5 transition-colors">次へ →</button>}
                            <button onClick={() => openEdit(s)} className="text-blue-400 hover:text-blue-600 px-1">✎</button>
                            <button onClick={() => del(s.id)} className="text-red-300 hover:text-red-500 px-1">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )
      }
    </div>
  );
}

// ==================== LABEL MAKER ====================
function LabelMaker({ products, settings }) {
  const NUTRIENTS = [
    { key: 'totalFat',    label: 'Total Fat',              unit: 'g',  dv: 78,   bold: true,  indent: 0 },
    { key: 'satFat',      label: 'Saturated Fat',          unit: 'g',  dv: 20,   bold: false, indent: 1 },
    { key: 'transFat',    label: 'Trans Fat',              unit: 'g',  dv: null, bold: false, indent: 1 },
    { key: 'cholesterol', label: 'Cholesterol',            unit: 'mg', dv: 300,  bold: true,  indent: 0 },
    { key: 'sodium',      label: 'Sodium',                 unit: 'mg', dv: 2300, bold: true,  indent: 0 },
    { key: 'totalCarb',   label: 'Total Carbohydrate',     unit: 'g',  dv: 275,  bold: true,  indent: 0 },
    { key: 'fiber',       label: 'Dietary Fiber',          unit: 'g',  dv: 28,   bold: false, indent: 1 },
    { key: 'totalSugars', label: 'Total Sugars',           unit: 'g',  dv: null, bold: false, indent: 1 },
    { key: 'addedSugars', label: 'Incl. Added Sugars',     unit: 'g',  dv: 50,   bold: false, indent: 2 },
    { key: 'protein',     label: 'Protein',                unit: 'g',  dv: null, bold: true,  indent: 0 },
  ];
  const VITAMINS = [
    { key: 'vitD',      label: 'Vitamin D',  unit: 'mcg', dv: 20   },
    { key: 'calcium',   label: 'Calcium',    unit: 'mg',  dv: 1300 },
    { key: 'iron',      label: 'Iron',       unit: 'mg',  dv: 18   },
    { key: 'potassium', label: 'Potassium',  unit: 'mg',  dv: 4700 },
  ];
  const blank = {
    productId: '', productNameEn: '', servingSize: '', servingsPerContainer: '', calories: '',
    totalFat: '', satFat: '', transFat: '', cholesterol: '', sodium: '',
    totalCarb: '', fiber: '', totalSugars: '', addedSugars: '', protein: '',
    vitD: '', calcium: '', iron: '', potassium: '',
    ingredients: '', containsAllergens: '', mayContain: '',
    netWeightG: '', netWeightOz: '',
    importerName: settings.companyNameEn || '', importerAddress: settings.companyAddressEn || '', countryOfOrigin: 'Japan',
  };
  const [form, setForm] = useState(() => ls.get('oryzae_label_draft', blank));
  const upd = (k, v) => setForm(f => { const n = { ...f, [k]: v }; ls.set('oryzae_label_draft', n); return n; });
  const handleProductSelect = (pid) => {
    const p = products.find(x => x.id === pid);
    setForm(f => { const n = { ...f, productId: pid, productNameEn: p ? p.name : f.productNameEn }; ls.set('oryzae_label_draft', n); return n; });
  };
  const pct = (amt, dv) => (!dv || !amt || isNaN(Number(amt))) ? null : Math.round((Number(amt) / dv) * 100);
  const print = () => { const prev = document.title; document.title = `${form.productNameEn || 'Label'}_Nutrition_Facts`; window.print(); document.title = prev; };

  const Field = ({ label, k, type = 'text', placeholder = '' }) => (
    <div><label className="text-xs text-gray-500">{label}</label>
      <input type={type} className="w-full border rounded p-2 mt-0.5 text-sm" value={form[k] ?? ''} onChange={e => upd(k, e.target.value)} placeholder={placeholder} /></div>
  );

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h2 className="text-xl font-bold text-gray-800">米国向けラベル作成</h2>
          <p className="text-sm text-gray-400">FDA 2020 Nutrition Facts フォーマット準拠</p>
        </div>
        <div className="no-print flex gap-2">
          <button onClick={() => { if (confirm('入力内容をリセットしますか？')) { ls.set('oryzae_label_draft', blank); setForm(blank); } }} className="border border-gray-300 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-50">リセット</button>
          <button onClick={print} className="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700">🖨️ 印刷 / PDF保存</button>
        </div>
      </div>

      <div className="flex flex-col lg:flex-row gap-6">
        {/* 入力フォーム */}
        <div className="no-print lg:w-96 space-y-4 flex-shrink-0">
          <div className="bg-white rounded-xl p-4 shadow-sm space-y-3">
            <h3 className="font-semibold text-gray-700">商品情報</h3>
            <div><label className="text-xs text-gray-500">製品マスタから選択（任意）</label>
              <select className="w-full border rounded p-2 mt-0.5 text-sm" value={form.productId} onChange={e => handleProductSelect(e.target.value)}>
                <option value="">-- 選択 --</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <Field label="商品名（英語）*" k="productNameEn" placeholder="e.g. KOJIPOP Fermented Soda" />
            <div className="grid grid-cols-2 gap-2">
              <Field label="Serving Size" k="servingSize" placeholder="1 can (350mL)" />
              <Field label="Servings Per Container" k="servingsPerContainer" placeholder="1" />
            </div>
            <Field label="Calories" k="calories" type="number" placeholder="90" />
          </div>

          <div className="bg-white rounded-xl p-4 shadow-sm">
            <h3 className="font-semibold text-gray-700 mb-3">栄養成分（1サービングあたり）</h3>
            <div className="grid grid-cols-2 gap-2">
              {[...NUTRIENTS, ...VITAMINS].map(n => (
                <div key={n.key}><label className="text-xs text-gray-500">{n.label}（{n.unit}）</label>
                  <input type="number" className="w-full border rounded p-1.5 mt-0.5 text-sm" value={form[n.key] ?? ''} onChange={e => upd(n.key, e.target.value)} placeholder="0" /></div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl p-4 shadow-sm space-y-3">
            <h3 className="font-semibold text-gray-700">原材料・アレルゲン</h3>
            <div><label className="text-xs text-gray-500">Ingredients（含有量順・英語）</label>
              <textarea className="w-full border rounded p-2 mt-0.5 text-sm" rows={3} value={form.ingredients} onChange={e => upd('ingredients', e.target.value)} placeholder="Carbonated water, Rice koji, Citric acid" /></div>
            <Field label="CONTAINS（確定アレルゲン）" k="containsAllergens" placeholder="Wheat, Soybeans" />
            <Field label="May contain（混入注意・任意）" k="mayContain" placeholder="Tree nuts" />
          </div>

          <div className="bg-white rounded-xl p-4 shadow-sm space-y-3">
            <h3 className="font-semibold text-gray-700">内容量・会社情報</h3>
            <div className="grid grid-cols-2 gap-2">
              <Field label="内容量（g / mL）" k="netWeightG" type="number" placeholder="350" />
              <Field label="内容量（oz / fl.oz）" k="netWeightOz" type="number" placeholder="11.83" />
            </div>
            <Field label="輸入者・会社名（英語）" k="importerName" />
            <Field label="住所（英語）" k="importerAddress" />
            <Field label="原産国" k="countryOfOrigin" placeholder="Japan" />
          </div>
        </div>

        {/* ラベルプレビュー */}
        <div className="flex-1 print-area">
          <div className="bg-white rounded-xl p-6 shadow-sm">
            <p className="no-print text-xs text-gray-400 mb-4 font-medium">▼ 印刷プレビュー</p>
            <div style={{ fontFamily: 'Arial, Helvetica, sans-serif', maxWidth: '300px' }}>
              {form.productNameEn && (
                <p style={{ fontFamily: '"Arial Black", Arial, sans-serif', fontSize: '22px', fontWeight: '900', marginBottom: '2px' }}>{form.productNameEn}</p>
              )}
              {(form.netWeightG || form.netWeightOz) && (
                <p style={{ fontSize: '12px', marginBottom: '10px' }}>
                  {form.netWeightOz ? `${form.netWeightOz} fl oz` : ''}{form.netWeightOz && form.netWeightG ? ' (' : ''}{form.netWeightG ? `${form.netWeightG} mL` : ''}{form.netWeightOz && form.netWeightG ? ')' : ''}
                </p>
              )}

              {/* Nutrition Facts Box */}
              <div style={{ border: '3px solid black', padding: '4px 6px', width: '280px', boxSizing: 'border-box' }}>
                <p style={{ fontFamily: '"Arial Black", Arial, sans-serif', fontSize: '32px', fontWeight: '900', lineHeight: '1', marginBottom: '1px' }}>Nutrition Facts</p>
                {form.servingsPerContainer && <p style={{ fontSize: '11px', margin: '0' }}>{form.servingsPerContainer} serving{form.servingsPerContainer !== '1' ? 's' : ''} per container</p>}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', borderBottom: '8px solid black', paddingBottom: '1px', marginBottom: '1px' }}>
                  <span style={{ fontWeight: 'bold', fontSize: '12px' }}>Serving size</span>
                  <span style={{ fontSize: '11px' }}>{form.servingSize}</span>
                </div>
                <p style={{ fontSize: '10px', fontWeight: 'bold', margin: '0' }}>Amount per serving</p>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', borderBottom: '4px solid black', paddingBottom: '1px' }}>
                  <span style={{ fontFamily: '"Arial Black", Arial, sans-serif', fontSize: '18px', fontWeight: '900' }}>Calories</span>
                  <span style={{ fontFamily: '"Arial Black", Arial, sans-serif', fontSize: '40px', fontWeight: '900', lineHeight: '1' }}>{form.calories || ''}</span>
                </div>
                <p style={{ textAlign: 'right', fontSize: '10px', borderBottom: '1px solid black', padding: '1px 0', margin: '0' }}>% Daily Value*</p>
                {NUTRIENTS.map((n, i) => {
                  const dvPct = pct(form[n.key], n.dv);
                  const isLast = i === NUTRIENTS.length - 1;
                  return (
                    <div key={n.key} style={{ display: 'flex', justifyContent: 'space-between', borderBottom: isLast ? '4px solid black' : '0.5px solid black', padding: '1px 0 1px ' + (n.indent === 2 ? '24px' : n.indent === 1 ? '12px' : '0') }}>
                      <span style={{ fontWeight: n.bold ? 'bold' : 'normal', fontSize: '11px' }}>
                        {n.label} <span style={{ fontWeight: 'normal' }}>{form[n.key] !== '' && form[n.key] != null ? `${form[n.key]}${n.unit}` : ''}</span>
                      </span>
                      {dvPct !== null && <span style={{ fontWeight: 'bold', fontSize: '11px' }}>{dvPct}%</span>}
                    </div>
                  );
                })}
                <div style={{ borderBottom: '8px solid black' }}>
                  {VITAMINS.map(v => {
                    const dvPct = pct(form[v.key], v.dv);
                    return (
                      <div key={v.key} style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '0.5px solid black', padding: '1px 0', fontSize: '11px' }}>
                        <span>{v.label} {form[v.key] !== '' && form[v.key] != null ? `${form[v.key]}${v.unit}` : ''}</span>
                        {dvPct !== null && <span style={{ fontWeight: 'bold' }}>{dvPct}%</span>}
                      </div>
                    );
                  })}
                </div>
                <p style={{ fontSize: '8.5px', lineHeight: '1.3', marginTop: '3px', color: '#111' }}>* The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.</p>
              </div>

              {form.ingredients && (
                <p style={{ maxWidth: '280px', marginTop: '8px', fontSize: '11px', lineHeight: '1.4' }}><strong>INGREDIENTS: </strong>{form.ingredients}.</p>
              )}
              {form.containsAllergens && (
                <p style={{ maxWidth: '280px', marginTop: '4px', fontSize: '11px' }}><strong>CONTAINS: {form.containsAllergens.toUpperCase()}.</strong></p>
              )}
              {form.mayContain && (
                <p style={{ maxWidth: '280px', marginTop: '2px', fontSize: '11px' }}>May contain {form.mayContain}.</p>
              )}
              {(form.importerName || form.importerAddress || form.countryOfOrigin) && (
                <div style={{ maxWidth: '280px', marginTop: '10px', fontSize: '10px', color: '#333', lineHeight: '1.5' }}>
                  {form.importerName && <p style={{ margin: 0 }}>{form.importerName}</p>}
                  {form.importerAddress && <p style={{ margin: 0 }}>{form.importerAddress}</p>}
                  {form.countryOfOrigin && <p style={{ margin: 0 }}>Product of {form.countryOfOrigin}</p>}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

製品マスタに登録した商品のHSコードを一覧表示。クリックで参照します

【カスタム検索】
任意のHSコードを直接入力して検索できます

【Slack送信】
検索結果をSlackに送信できます（設定でWebhook URLを設定してください）`,
    },
    {
      id: 'settings', icon: '⚙️', title: '設定',
      content: `5つのセクションで各種設定を管理します。

【会社情報】
書類に印字される会社名（日/英）・住所・連絡先

【価格計算】
海上運賃・保険料率・国内物流費・マークアップ率のデフォルト値

【Slack】
Webhook URLの設定・ステータスの手動/自動送信・ブラウザ通知の有効化

【データ管理】
全データのJSON export/import・全リセット

【社内共有】
GitHub Pages URL・データ共有手順`,
    },
    {
      id: 'tips', icon: '💡', title: 'よくある使い方・Tips',
      content: `【初回セットアップ手順】
1. 設定 → 会社情報 を入力・保存
2. 製品マスタ → 商品を登録
3. 価格計算 → レート取得 → 各種コストを確認
4. バイヤー管理 → バイヤーを登録
5. FDA対応 → 必須9項目を順番にチェック

【社内で共有するには】
設定 → データ管理 → エクスポート（JSON）でデータを保存し、相手に渡してインポートしてもらう

【毎朝の使い方】
ホームタブで今日の要対応事項（期限切れ・FDA未対応・遅延船）を確認 → 各タブで対応

【Slack自動通知】
設定 → Slack → Webhook URLを設定 → 「起動時に自動送信」をON
毎朝アプリを開くと自動でステータス通知が届きます`,
    },
  ];

  return (
    <div className="space-y-4 max-w-3xl">
      <div>
        <h2 className="text-xl font-bold text-gray-800 mb-0.5">使い方ガイド</h2>
        <p className="text-sm text-gray-400">各セクションをクリックして展開してください</p>
      </div>
      <div className="space-y-2">
        {sections.map(s => (
          <div key={s.id} className="bg-white rounded-xl shadow-sm overflow-hidden">
            <button onClick={() => setOpen(open === s.id ? null : s.id)}
              className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-gray-50 transition-colors">
              <span className="flex items-center gap-3 font-medium text-gray-800">
                <span className="text-xl">{s.icon}</span>{s.title}
              </span>
              <span className="text-gray-400 text-sm">{open === s.id ? '▲' : '▼'}</span>
            </button>
            {open === s.id && (
              <div className="px-5 pb-5 border-t pt-4">
                <pre className="text-sm text-gray-600 whitespace-pre-wrap font-sans leading-relaxed">{s.content}</pre>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ==================== APP ====================
function App() {
  const [tab,         setTab]    = useState('home');
  const [products,  setProducts] = useState(() => ls.get('oryzae_products',  DEFAULT_PRODUCTS));
  const [settings,  setSettings] = useState(() => ls.get('oryzae_settings',  DEFAULT_SETTINGS));
  const [buyers,    setBuyers]   = useState(() => ls.get('oryzae_buyers',    []));
  const [fdaStatus, setFda]      = useState(() => ls.get('oryzae_fda',       {}));
  const [shipHistory, setShipH]  = useState(() => ls.get('oryzae_shipments', []));
  const [pendingDocItem, setPending] = useState(null);
  const [pendingPricePid, setPricePid] = useState(null);
  const [schedules, setSchedules] = useState(() => ls.get('oryzae_schedules', []));

  useEffect(() => ls.set('oryzae_products',  products),  [products]);
  useEffect(() => ls.set('oryzae_settings',  settings),  [settings]);
  useEffect(() => ls.set('oryzae_buyers',    buyers),    [buyers]);
  useEffect(() => ls.set('oryzae_fda',       fdaStatus), [fdaStatus]);
  useEffect(() => ls.set('oryzae_shipments', shipHistory), [shipHistory]);
  useEffect(() => ls.set('oryzae_schedules', schedules),   [schedules]);

  // ==================== 起動時自動化 ====================
  useEffect(() => {
    const today = new Date().toISOString().split('T')[0];

    // 1. 為替レート自動取得（キャッシュ切れのとき）
    if (!getCachedRate()) fetchRate().catch(() => {});

    // 2. Slack自動通知（1日1回）
    if (settings.slackAutoNotify && settings.slackWebhook) {
      const last = ls.get('oryzae_last_slack_notify', '');
      if (last !== today) {
        ls.set('oryzae_last_slack_notify', today);
        const c = getCachedRate();
        const overdueB = buyers.filter(b => b.nextActionDate && b.nextActionDate < today);
        const fdaCrit  = FDA_CHECKLIST.filter(x => x.critical && (fdaStatus[x.id] || 'pending') !== 'done');
        const text = [
          '*ORYZAE Export Ops — 本日のステータス（自動通知）*',
          `📅 ${new Date().toLocaleDateString('ja-JP')}`,
          c ? `💱 為替: 1円 = $${c.rate.toFixed(6)}（${c.date}）` : '💱 為替: 未取得',
          `🏥 FDA必須未対応: ${fdaCrit.length}件${fdaCrit.length > 0 ? ' — ' + fdaCrit.slice(0, 3).map(x => x.title).join('、') : ' ✓'}`,
          `🤝 バイヤー期限切れ: ${overdueB.length}件${overdueB.length > 0 ? ' — ' + overdueB.map(b => b.company).slice(0, 3).join('、') : ' ✓'}`,
        ].join('\n');
        fetch(settings.slackWebhook, { method: 'POST', body: JSON.stringify({ text }) }).catch(() => {});
      }
    }

    // 3. ブラウザ通知（1日1回・許可済みの場合）
    if ('Notification' in window && Notification.permission === 'granted') {
      const last = ls.get('oryzae_last_browser_notify', '');
      if (last !== today) {
        ls.set('oryzae_last_browser_notify', today);
        const overdueB = buyers.filter(b => b.nextActionDate && b.nextActionDate < today);
        const fdaCrit  = FDA_CHECKLIST.filter(x => x.critical && (fdaStatus[x.id] || 'pending') !== 'done');
        if (overdueB.length > 0) {
          new Notification('ORYZAE Export Ops', {
            body: `バイヤー対応期限切れ ${overdueB.length}件: ${overdueB.map(b => b.company).slice(0, 3).join('、')}`,
            icon: '',
          });
        }
        if (fdaCrit.length > 0) {
          new Notification('ORYZAE Export Ops', {
            body: `FDA必須未対応 ${fdaCrit.length}件あります`,
            icon: '',
          });
        }
      }
    }
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // 価格計算 → 書類作成へ連携
  const handleSendToDoc = (product, result, qty) => {
    setPending({ product, result, qty: qty || 1000 });
    setTab('documents');
  };

  // 製品マスタ → 価格計算へ連携
  const handleGoToPricing = (pid) => { setPricePid(pid); setTab('pricing'); };

  const fdaCritLeft = FDA_CHECKLIST.filter(x => x.critical && (fdaStatus[x.id] || 'pending') !== 'done').length;
  const overdueCount = buyers.filter(b => b.nextActionDate && new Date(b.nextActionDate) < new Date()).length;

  return (
    <div className="min-h-screen bg-gray-100">
      <header className="bg-gray-900 text-white px-4 py-3 no-print">
        <div className="max-w-6xl mx-auto flex items-center justify-between">
          <div>
            <h1 className="font-bold text-lg tracking-wide">ORYZAE Export Ops</h1>
            <p className="text-gray-400 text-xs mt-0.5">海外事業部 輸出管理ツール</p>
          </div>
          <p className="text-gray-400 text-xs">{new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
        </div>
      </header>

      <nav className="bg-white border-b shadow-sm no-print sticky top-0 z-40">
        <div className="max-w-6xl mx-auto flex overflow-x-auto hide-scrollbar">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex items-center gap-1.5 px-4 py-3.5 text-sm font-medium whitespace-nowrap border-b-2 transition-colors relative
                ${tab === t.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-800 hover:border-gray-300'}`}>
              <span>{t.icon}</span>{t.label}
              {t.id === 'fda'    && fdaCritLeft   > 0 && <span className="absolute top-2 right-0.5 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold">{fdaCritLeft}</span>}
              {t.id === 'buyers' && overdueCount  > 0 && <span className="absolute top-2 right-0.5 bg-orange-400 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold">{overdueCount}</span>}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-6xl mx-auto p-4 md:p-6">
        {tab === 'home'      && <Dashboard       products={products}    buyers={buyers} fdaStatus={fdaStatus} schedules={schedules} setTab={setTab} />}
        {tab === 'products'  && <ProductMaster   products={products}    setProducts={setProducts} onGoToPricing={handleGoToPricing} />}
        {tab === 'pricing'   && <PriceCalculator products={products}    settings={settings} onSendToDoc={handleSendToDoc} pendingPricePid={pendingPricePid} clearPendingPrice={() => setPricePid(null)} />}
        {tab === 'documents' && <DocumentCreator products={products}    settings={settings} buyers={buyers} shipHistory={shipHistory} setShipHistory={setShipH} pendingDocItem={pendingDocItem} clearPendingDoc={() => setPending(null)} />}
        {tab === 'buyers'    && <BuyerManagement buyers={buyers}        setBuyers={setBuyers} />}
        {tab === 'fda'       && <FDAChecklist    fdaStatus={fdaStatus}  setFdaStatus={setFda} settings={settings} />}
        {tab === 'schedule'  && <ShipSchedule    schedules={schedules} setSchedules={setSchedules} />}
        {tab === 'tariff'    && <TariffSearch    settings={settings} products={products} />}
        {tab === 'settings'  && <Settings        settings={settings}    setSettings={setSettings} products={products} buyers={buyers} fdaStatus={fdaStatus} shipHistory={shipHistory} schedules={schedules} />}
        {tab === 'label'     && <LabelMaker     products={products}    settings={settings} />}
        {tab === 'help'      && <Help />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
